<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analyzer Front Test — Грамматика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f8fafc;
        }

        .hero {
            background: linear-gradient(135deg, #20c997 0%, #0d6efd 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.25);
        }

        #log {
            white-space: pre-wrap;
            background: #0b1220;
            color: #d2ffd2;
            padding: 12px 14px;
            border-radius: 0.5rem;
        }

        .tag {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            background: #eef2ff;
            color: #3730a3;
            font-size: 0.75rem;
            margin-right: 0.25rem;
        }

        .check-ok {
            color: #198754;
        }

        .check-bad {
            color: #b00020;
        }

        .score {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0.5rem 0 1rem;
        }
    </style>
    <link rel="icon" href="data:,">
    <meta name="color-scheme" content="light dark" />
</head>

<body>
    <section class="hero">
        <div class="container">
            <h1 class="h3 mb-0">Задание — Проверка грамматики (S-P-O)</h1>
            <div class="text-white-50">Отправляет текст на эндпоинт <code>/v1/text/grammar</code></div>
        </div>
    </section>

    <main class="container mb-5">
        <div class="row g-4">
            <div class="col-12 col-lg-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light"><strong>Ввод</strong></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Текст для анализа</label>
                            <textarea id="text" class="form-control" rows="8"
                                placeholder="Вставьте несколько предложений для проверки по S–P–O, падежам и согласованию.">Студент быстро читает интересную книгу. Потом читает статью.</textarea>
                        </div>

                        <div class="row g-3 align-items-end mb-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label">Материал урока (леммы через запятую)</label>
                                <input id="lesson" class="form-control"
                                    placeholder="читать, интересный, быстро, студент, книга" />
                            </div>
                            <div class="col-6 col-md-3 form-check mt-4">
                                <input class="form-check-input" type="checkbox" id="allowEll" />
                                <label class="form-check-label" for="allowEll">Разрешать эллипсис S</label>
                            </div>
                            <div class="col-6 col-md-3 form-check mt-4">
                                <input class="form-check-input" type="checkbox" id="normalize" checked />
                                <label class="form-check-label" for="normalize">Нормализовать</label>
                            </div>
                        </div>

                        <div class="row g-3 align-items-end">
                            <div class="col-12 col-md-5">
                                <label class="form-label">API URL</label>
                                <input id="api" class="form-control" value="http://178.236.254.250:8000" />
                            </div>
                            <div class="col-12 col-md-3 d-grid">
                                <button id="btnSend" class="btn btn-primary w-100">🚀 Отправить</button>
                            </div>
                            <div class="col-12 col-md-4 small text-muted" id="hint"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light"><strong>Ответ</strong></div>
                    <div id="out" class="card-body"></div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-header bg-light"><strong>Лог</strong></div>
                    <div class="card-body">
                        <div id="log" class="small"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        const textEl = document.getElementById('text');
        const lessonEl = document.getElementById('lesson');
        const allowEllEl = document.getElementById('allowEll');
        const normalizeEl = document.getElementById('normalize');
        const apiEl = document.getElementById('api');
        const btnSend = document.getElementById('btnSend');
        const out = document.getElementById('out');
        const log = document.getElementById('log');
        const hint = document.getElementById('hint');

        function logln(msg) { log.textContent += msg + '\n'; }
        function setLoading(b) { btnSend.disabled = b; hint.textContent = b ? '⏳ Обработка...' : ''; }
        function fmtNum(n) { if (n === null || n === undefined || isNaN(Number(n))) return ''; return Number(n).toFixed(1); }
        function yesNo(b) { return b ? '<span class="check-ok">✓</span>' : '<span class="check-bad">✗</span>'; }

        function renderReport(data) {
            const normalized = data.normalized || '';
            const rep = data.report || {};
            const agg = rep.aggregates || {};
            const sents = rep.sentences || [];

            const head = `
                <div class="mb-2"><span class="tag">Нормализованный текст</span> ${normalized ? normalized : '<span class="text-muted">—</span>'}</div>
                <div class="score">Общий балл: ${fmtNum(rep.score)}</div>
                <div class="row">
                  <div class="col-6 col-md-4">S-P-O: <b>${fmtNum(agg.spo_presence)}</b></div>
                  <div class="col-6 col-md-4">Subj И.п.: <b>${fmtNum(agg.subject_case_ok)}</b></div>
                  <div class="col-6 col-md-4">Предикат: <b>${fmtNum(agg.predicate_form_ok)}</b></div>
                  <div class="col-6 col-md-4">Obj падеж: <b>${fmtNum(agg.object_case_ok)}</b></div>
                  <div class="col-6 col-md-4">Прил. соглас.: <b>${fmtNum(agg.adj_agreement_ok)}</b></div>
                  <div class="col-6 col-md-4">Наречия: <b>${fmtNum(agg.adv_position_ok)}</b></div>
                </div>
            `;

            const rows = sents.map(s => `
                <tr>
                  <td>${s.sentence || ''}</td>
                  <td>${s.subject || '—'}</td>
                  <td>${s.predicate || '—'}</td>
                  <td>${s.object || '—'}</td>
                  <td>${yesNo(s.checks?.spo_presence)}</td>
                  <td>${yesNo(s.checks?.subject_case_ok)}</td>
                  <td>${yesNo(s.checks?.predicate_form_ok)}</td>
                  <td>${yesNo(s.checks?.object_case_ok)}</td>
                  <td>${yesNo(s.checks?.adj_agreement_ok)}</td>
                  <td>${yesNo(s.checks?.adv_position_ok)}</td>
                  <td>${Array.isArray(s.suggestions) ? s.suggestions.join(' • ') : ''}</td>
                </tr>
            `).join('');

            const table = `
                <h4 class="h6 mt-3">Разбор по предложениям</h4>
                <div class="table-responsive">
                <table class="table table-sm table-striped align-middle">
                  <thead class="table-light">
                    <tr>
                      <th>Предложение</th>
                      <th>Субъект</th>
                      <th>Предикат</th>
                      <th>Объект</th>
                      <th>SPO</th>
                      <th>Subj И.п.</th>
                      <th>Предикат ок</th>
                      <th>Obj падеж</th>
                      <th>Прил. соглас.</th>
                      <th>Нареч. позиция</th>
                      <th>Рекомендации</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
                </div>
            `;

            out.innerHTML = head + table;
        }

        async function sendToApi() {
            try {
                setLoading(true);
                const api = (apiEl && apiEl.value && apiEl.value.trim()) ? apiEl.value.trim() : 'http://178.236.254.250:8000';
                const text = textEl.value || '';
                const lesson = (lessonEl.value || '').split(',').map(x => x.trim()).filter(Boolean);
                const payload = {
                    text,
                    allow_subject_ellipsis: !!allowEllEl.checked,
                    lesson_items: lesson.length ? lesson : null,
                    normalize: !!normalizeEl.checked,
                };
                logln('POST ' + api + '/v1/text/grammar');
                const res = await fetch(api + '/v1/text/grammar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const raw = await res.text();
                let data; try { data = JSON.parse(raw); } catch (_) { data = { raw }; }
                if (!res.ok) {
                    out.innerHTML = `<pre style="color:#b00020">HTTP ${res.status}\n${raw}</pre>`;
                    return;
                }
                renderReport(data);
            } catch (e) {
                out.innerHTML = `<pre style="color:#b00020">Ошибка: ${e}</pre>`;
            } finally {
                setLoading(false);
            }
        }

        btnSend.addEventListener('click', sendToApi);
    </script>
</body>

</html>
